apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gym-catalog-postgres
  namespace: gym-dev
  labels:
    app: gym-catalog-postgres
    component: database
    service: gym-catalog-postgres
spec:
  serviceName: gym-catalog-postgres
  replicas: 1
  selector:
    matchLabels:
      app: gym-catalog-postgres
      component: database
  template:
    metadata:
      labels:
        app: gym-catalog-postgres
        component: database
        service: gym-catalog-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "$(POSTGRES_USER)"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "$(POSTGRES_USER)"
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: gym-catalog-postgres
          component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
